<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in / Sign up — Shock Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .auth-card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
      text-align: center;
    }
    .auth-card h1 { font-size: 1.5rem; font-weight: 600; color: #1a1a2e; }
    .auth-card p { color: #666; font-size: 0.95rem; }
    .btn-gold {
      background: #fcc12d;
      border: none;
      color: #1a1a2e;
      font-weight: 600;
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }
    .btn-gold:hover { background: #fcbd20; color: #1a1a2e; }
    .btn-outline-dark { width: 100%; padding: 0.75rem; border-radius: 8px; }
    .status { font-size: 0.85rem; color: #888; margin-top: 1rem; }
    a.back { color: #fcc12d; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="mb-3">
      <i class="fas fa-bolt fa-2x" style="color:#fcc12d;"></i>
    </div>
    <h1 class="mb-2">Shock Network</h1>
    <p class="mb-4">Log in or create an account with Auth0.</p>

    <button type="button" class="btn btn-gold" id="btn-login">
      <i class="fas fa-sign-in-alt me-2"></i> Log in
    </button>
    <button type="button" class="btn btn-outline-dark" id="btn-signup">
      <i class="fas fa-user-plus me-2"></i> Sign up
    </button>

    <p class="status" id="status">Loading…</p>
    <p class="mt-3 mb-0"><a class="back" href="index.html">← Back to home</a></p>
  </div>

  <script>
    // Replace with your Auth0 Domain and Client ID
    const AUTH0_CONFIG = {
      domain: "YOUR_TENANT.auth0.com",
      clientId: "YOUR_CLIENT_ID",
      authorizationParams: {
        redirect_uri: ""
      },
      cacheLocation: "localstorage"
    };

    const homePath = (() => {
      const p = window.location.pathname;
      if (p.includes("shocknet.github.io")) {
        return window.location.origin + "/shocknet.github.io/";
      }
      return window.location.origin + "/";
    })();
    AUTH0_CONFIG.authorizationParams.redirect_uri = homePath;

    async function main() {
      const status = document.getElementById("status");
      const loginBtn = document.getElementById("btn-login");
      const signupBtn = document.getElementById("btn-signup");

      const notConfigured =
        AUTH0_CONFIG.domain.includes("YOUR_TENANT") ||
        AUTH0_CONFIG.clientId.includes("YOUR_CLIENT");

      if (notConfigured) {
        status.textContent = "Auth0 not configured — add Domain & Client ID in login.html and index.html";
        const alertMsg = () => alert(
          "Create a free Auth0 SPA application, then set domain and clientId in login.html and index.html.\n\n" +
          "Allowed Callback / Logout / Web Origins must include:\n" + homePath
        );
        loginBtn.onclick = alertMsg;
        signupBtn.onclick = alertMsg;
        return;
      }

      try {
        const client = await auth0.createAuth0Client(AUTH0_CONFIG);

        if (window.location.search.includes("code=")) {
          await client.handleRedirectCallback();
          window.location.href = homePath;
          return;
        }

        if (await client.isAuthenticated()) {
          const user = await client.getUser();
          status.textContent = "Signed in as " + (user.name || user.email);
          loginBtn.textContent = "Continue to site";
          loginBtn.onclick = () => { window.location.href = homePath; };
          signupBtn.style.display = "none";
          return;
        }

        status.textContent = "Secure login powered by Auth0";
        loginBtn.onclick = () => client.loginWithRedirect({ authorizationParams: { screen_hint: "login" } });
        signupBtn.onclick = () => client.loginWithRedirect({ authorizationParams: { screen_hint: "signup" } });
      } catch (e) {
        console.error(e);
        status.textContent = "Auth0 error — check Domain, Client ID, and Allowed URLs";
      }
    }
    main();
  </script>
</body>
</html>
